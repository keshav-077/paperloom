<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" role="img" aria-label="PaperLoom product journey">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e75b37"/>
      <stop offset="50%" stop-color="#a36a1e"/>
      <stop offset="100%" stop-color="#2e7254"/>
    </linearGradient>
  </defs>

  <!-- vertical journey line -->
  <rect x="196" y="40" width="8" height="720" rx="4" fill="#d8d3c9" opacity="0.4"/>
  <rect x="196" y="40" width="8" height="0" rx="4" fill="url(#track)">
    <animate attributeName="height" values="0;720;720;0" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Step 1: Ask -->
  <g transform="translate(40,60)">
    <circle cx="160" cy="0" r="14" fill="#171a22">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <rect width="320" height="72" rx="14" fill="#fbfaf6" stroke="#d8d3c9" stroke-width="2"/>
    <text x="16" y="28" fill="#e75b37" font-family="system-ui,sans-serif" font-size="9" font-weight="700">01 · ASK</text>
    <text x="16" y="50" fill="#171a22" font-family="Georgia,serif" font-size="13" font-style="italic">"Explain Attention Is All You Need"</text>
  </g>

  <!-- Step 2: Evidence -->
  <g transform="translate(40,200)">
    <circle cx="160" cy="0" r="14" fill="#e75b37">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect width="320" height="72" rx="14" fill="#fbfaf6" stroke="#d8d3c9" stroke-width="2"/>
    <text x="16" y="28" fill="#e75b37" font-family="system-ui,sans-serif" font-size="9" font-weight="700">02 · EVIDENCE</text>
    <text x="16" y="50" fill="#171a22" font-family="system-ui,sans-serif" font-size="12">Every claim ’ page + exact quote</text>
  </g>

  <!-- Step 3: Learn -->
  <g transform="translate(40,340)">
    <circle cx="160" cy="0" r="14" fill="#a36a1e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <rect width="320" height="72" rx="14" fill="#fbfaf6" stroke="#d8d3c9" stroke-width="2"/>
    <text x="16" y="28" fill="#e75b37" font-family="system-ui,sans-serif" font-size="9" font-weight="700">03 · LEARN</text>
    <text x="16" y="50" fill="#171a22" font-family="system-ui,sans-serif" font-size="12">Primer · playground · quiz</text>
  </g>

  <!-- Step 4: Story -->
  <g transform="translate(40,480)">
    <circle cx="160" cy="0" r="14" fill="#2e7254">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="4.8s" repeatCount="indefinite"/>
    </circle>
    <rect width="320" height="72" rx="14" fill="#fbfaf6" stroke="#d8d3c9" stroke-width="2"/>
    <text x="16" y="28" fill="#e75b37" font-family="system-ui,sans-serif" font-size="9" font-weight="700">04 · STORY</text>
    <text x="16" y="50" fill="#171a22" font-family="system-ui,sans-serif" font-size="12">Narrative with source-linked visuals</text>
  </g>

  <!-- Step 5: Share -->
  <g transform="translate(40,620)">
    <circle cx="160" cy="0" r="14" fill="#171a22">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="6.4s" repeatCount="indefinite"/>
    </circle>
    <rect width="320" height="72" rx="14" fill="#171a22"/>
    <text x="16" y="28" fill="#e99a82" font-family="system-ui,sans-serif" font-size="9" font-weight="700">05 · SHARE</text>
    <text x="16" y="50" fill="#fbfaf6" font-family="system-ui,sans-serif" font-size="12">Local site + portable .trace.json</text>
  </g>

  <!-- scrolling indicator -->
  <g transform="translate(188,760)">
    <rect width="24" height="36" rx="12" fill="none" stroke="#71766f" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="#e75b37">
      <animate attributeName="cy" values="10;22;10" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
