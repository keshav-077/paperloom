<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Evidence validation chain">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a22"/>
      <stop offset="100%" stop-color="#2a2d35"/>
    </linearGradient>
    <filter id="soft">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(280,120)" filter="url(#soft)">
    <circle cx="80" cy="60" r="50" fill="url(#hub)">
      <animate attributeName="r" values="48;52;48" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="56" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Evidence</text>
    <text x="80" y="72" text-anchor="middle" fill="#d8d3c9" font-family="system-ui,sans-serif" font-size="10">graph</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11" font-weight="600">
    <g transform="translate(32,32)" filter="url(#soft)">
      <rect width="120" height="52" rx="12" fill="#f2efe7" stroke="#beb9af" stroke-width="2"/>
      <text x="60" y="32" text-anchor="middle" fill="#171a22">PDF pages</text>
    </g>
    <g transform="translate(32,260)" filter="url(#soft)">
      <rect width="120" height="52" rx="12" fill="#f2efe7" stroke="#beb9af" stroke-width="2"/>
      <text x="60" y="32" text-anchor="middle" fill="#171a22">arXiv meta</text>
    </g>
    <g transform="translate(520,16)" filter="url(#soft)"><rect width="100" height="40" rx="10" fill="#fbfaf6" stroke="#d8d3c9"/><text x="50" y="26" text-anchor="middle" fill="#171a22">Report</text></g>
    <g transform="translate(520,72)" filter="url(#soft)"><rect width="100" height="40" rx="10" fill="#fbfaf6" stroke="#d8d3c9"/><text x="50" y="26" text-anchor="middle" fill="#171a22">Story</text></g>
    <g transform="translate(520,128)" filter="url(#soft)"><rect width="100" height="40" rx="10" fill="#fbfaf6" stroke="#d8d3c9"/><text x="50" y="26" text-anchor="middle" fill="#171a22">Learning</text></g>
    <g transform="translate(520,184)" filter="url(#soft)"><rect width="100" height="40" rx="10" fill="#fbfaf6" stroke="#d8d3c9"/><text x="50" y="26" text-anchor="middle" fill="#171a22">Playground</text></g>
  </g>

  <g transform="translate(300,268)" filter="url(#soft)">
    <polygon points="50,0 100,28 50,56 0,28" fill="#a36a1e"/>
    <text x="50" y="32" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Validate</text>
  </g>

  <g transform="translate(48,300)" filter="url(#soft)">
    <rect width="130" height="36" rx="10" fill="#e75b37"/>
    <text x="65" y="23" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Reject</text>
  </g>
  <g transform="translate(542,300)" filter="url(#soft)">
    <rect width="130" height="36" rx="10" fill="#2e7254"/>
    <text x="65" y="23" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Site + JSON</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M152 56 C220 56, 260 120, 320 160" stroke="#71766f" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M152 286 C220 260, 260 220, 320 190" stroke="#71766f" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M412 180 H520" stroke="#e75b37" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
