<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" role="img" aria-label="PaperLoom pipeline">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2efe7"/>
      <stop offset="100%" stop-color="#fbfaf6"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e75b37"/>
      <stop offset="100%" stop-color="#a36a1e"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#171a22" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#171a22">
    <g transform="translate(8,36)" filter="url(#cardShadow)">
      <rect width="108" height="76" rx="14" fill="url(#g1)" stroke="#beb9af" stroke-width="2"/>
      <text x="54" y="36" text-anchor="middle">Paper name</text>
      <text x="54" y="54" text-anchor="middle" fill="#71766f" font-weight="500">or PDF</text>
    </g>
    <g transform="translate(148,36)" filter="url(#cardShadow)">
      <rect width="108" height="76" rx="14" fill="#171a22"/>
      <text x="54" y="36" text-anchor="middle" fill="#fff">arXiv</text>
      <text x="54" y="54" text-anchor="middle" fill="#d8d3c9" font-weight="500">+ context</text>
    </g>
    <g transform="translate(288,36)" filter="url(#cardShadow)">
      <rect width="108" height="76" rx="14" fill="url(#g1)" stroke="#beb9af" stroke-width="2"/>
      <text x="54" y="36" text-anchor="middle">Evidence</text>
      <text x="54" y="54" text-anchor="middle" fill="#71766f" font-weight="500">+ quotes</text>
    </g>
    <g transform="translate(428,36)" filter="url(#cardShadow)">
      <rect width="108" height="76" rx="14" fill="url(#g1)" stroke="#beb9af" stroke-width="2"/>
      <text x="54" y="36" text-anchor="middle">Report</text>
      <text x="54" y="54" text-anchor="middle" fill="#71766f" font-weight="500">+ story</text>
    </g>
    <g transform="translate(568,36)" filter="url(#cardShadow)">
      <rect width="108" height="76" rx="14" fill="url(#g1)" stroke="#beb9af" stroke-width="2"/>
      <text x="54" y="36" text-anchor="middle">Learning</text>
      <text x="54" y="54" text-anchor="middle" fill="#71766f" font-weight="500">+ quiz</text>
    </g>
    <g transform="translate(708,28)" filter="url(#cardShadow)">
      <rect width="108" height="48" rx="14" fill="url(#gAccent)"/>
      <text x="54" y="30" text-anchor="middle" fill="#fff">Validate</text>
    </g>
    <g transform="translate(708,88)" filter="url(#cardShadow)">
      <rect width="108" height="48" rx="14" fill="#2e7254"/>
      <text x="54" y="30" text-anchor="middle" fill="#fff">.trace.json</text>
    </g>
    <g transform="translate(838,52)" filter="url(#cardShadow)">
      <rect width="72" height="56" rx="12" fill="#e75b37"/>
      <text x="36" y="34" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">Site</text>
    </g>
  </g>

  <!-- Animated progress bar -->
  <rect x="116" y="78" width="680" height="4" rx="2" fill="#d8d3c9" opacity="0.5"/>
  <rect x="116" y="78" width="0" height="4" rx="2" fill="#e75b37">
    <animate attributeName="width" values="0;680;680;0" keyTimes="0;0.55;0.8;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving dot along pipeline -->
  <circle r="6" fill="#e75b37">
    <animate attributeName="cx" values="116;796;796;116" keyTimes="0;0.55;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="78;78;78;78" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
