<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="PaperLoom - weave papers into proof-linked experiences">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f2efe7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e75b37"/>
      <stop offset="100%" stop-color="#a36a1e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7254"/>
      <stop offset="100%" stop-color="#3d9470"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#171a22" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- subtle grid -->
  <g opacity="0.25">
    <path d="M0 52 H960 M0 104 H960 M0 156 H960 M0 208 H960 M0 260 H960 M0 312 H960 M0 364 H960" stroke="#d8d3c9" stroke-width="1"/>
    <path d="M48 0 V420 M144 0 V420 M240 0 V420 M336 0 V420 M432 0 V420 M528 0 V420 M624 0 V420 M720 0 V420 M816 0 V420" stroke="#d8d3c9" stroke-width="1"/>
  </g>

  <!-- Isometric paper stack -->
  <g transform="translate(56,88)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="56,88; 56,78; 56,88" dur="5s" repeatCount="indefinite"/>
    <path d="M0 96 L128 32 L256 96 L256 224 L128 288 L0 224 Z" fill="#e8e4db" stroke="#beb9af" stroke-width="2"/>
    <path d="M16 104 L128 56 L240 104 L240 216 L128 264 L16 216 Z" fill="url(#paperGrad)" stroke="#beb9af" stroke-width="2"/>
    <path d="M128 56 L240 104 L240 112 L128 64 Z" fill="#f7f5ef"/>
    <path d="M36 132 H220 M36 152 H200 M36 172 H210" stroke="#d8d3c9" stroke-width="3" stroke-linecap="round"/>
    <rect x="36" y="158" width="96" height="14" rx="3" fill="#e75b37" opacity="0.2">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="128" y="248" text-anchor="middle" fill="#71766f" font-family="system-ui,sans-serif" font-size="10" font-weight="600">PDF � page 12</text>
  </g>

  <!-- Evidence graph hub -->
  <g transform="translate(320,72)" filter="url(#shadow)">
    <circle cx="88" cy="88" r="44" fill="#171a22">
      <animate attributeName="r" values="42;46;42" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="84" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Evidence</text>
    <text x="88" y="98" text-anchor="middle" fill="#d8d3c9" font-family="system-ui,sans-serif" font-size="9">graph</text>

    <circle cx="240" cy="48" r="30" fill="url(#accentGrad)"/>
    <text x="240" y="52" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Claim</text>

    <circle cx="240" cy="148" r="30" fill="url(#greenGrad)"/>
    <text x="240" y="152" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Quote</text>

    <circle cx="360" cy="98" r="34" fill="#fbfaf6" stroke="#171a22" stroke-width="3"/>
    <text x="360" y="102" text-anchor="middle" fill="#171a22" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Site</text>

    <path d="M132 88 H210" stroke="#e75b37" stroke-width="3" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M132 100 H210" stroke="#2e7254" stroke-width="3" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M270 68 H326" stroke="#171a22" stroke-width="2.5" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M270 128 H326" stroke="#171a22" stroke-width="2.5" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Playground card (3D tilt) -->
  <g transform="translate(540,64)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="540,64; 540,54; 540,64" dur="6s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="380" height="220" rx="20" fill="#171a22"/>
    <rect x="14" y="14" width="352" height="192" rx="14" fill="#fbfaf6"/>
    <text x="28" y="44" fill="#171a22" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Attention Playground</text>
    <text x="28" y="68" fill="#71766f" font-family="ui-monospace,monospace" font-size="11">softmax(q.k / sqrt(d_k))</text>
    <path d="M36 150 C90 120, 140 170, 200 110 S300 80, 340 100" fill="none" stroke="#e75b37" stroke-width="3"/>
    <path d="M36 150 C90 148, 140 146, 200 145 S300 144, 340 143" fill="none" stroke="#2e7254" stroke-width="3" stroke-dasharray="6 4"/>
    <rect x="36" y="172" width="280" height="8" rx="4" fill="#d8d3c9"/>
    <rect x="36" y="172" width="140" height="8" rx="4" fill="url(#accentGrad)"/>
    <circle cx="176" cy="176" r="11" fill="#e75b37" filter="url(#glow)">
      <animate attributeName="cx" values="120;220;120" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="480" y="368" text-anchor="middle" fill="#171a22" font-family="Georgia,serif" font-size="28" font-weight="500" font-style="italic" letter-spacing="0.04em">PaperLoom</text>
  <text x="480" y="398" text-anchor="middle" fill="#71766f" font-family="system-ui,sans-serif" font-size="12" letter-spacing="0.14em">WEAVE PAPERS INTO PROOF-LINKED EXPERIENCES</text>
</svg>
